[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outlook-mcp"
version = "0.1.0"
description = "MCP server exposing Outlook/M365 via Microsoft Graph and EWS, authenticated via Apple Mac Mail's first-party OAuth client (sniffed once, refreshes forever)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Your Name" }]
dependencies = [
    "mcp>=1.27",
    "httpx>=0.27",
    "keyring>=25",
    "click>=8",
    "exchangelib>=5.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[project.scripts]
outlook-mcp = "outlook_mcp.server:main"
outlook-mcp-bootstrap = "outlook_mcp.bootstrap:main"

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
